spring:
  application:
    name: shopify-data-api

  # Database Configuration (Railway PostgreSQL)
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/shopify_data}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  # Flyway Configuration for Database Migrations
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    validate-on-migrate: false
    clean-disabled: false
    repair-on-migrate: true

  # Spring MVC Configuration
  mvc:
    async:
      # Total (wall-clock) ceiling on async/SSE responses. Kept above the delegation cap
      # (crs.agent.delegation-timeout-ms) so a legitimately-progressing deep delegation isn't
      # reaped mid-stream. A stalled request is bounded fast by the per-call timeouts instead.
      request-timeout: 180000

# Server Configuration
server:
  port: ${PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

# Shopify Configuration
shopify:
  # Your Shopify store URL (e.g., mystore.myshopify.com)
  shop-url: ${SHOPIFY_SHOP_URL}
  # Your Shopify Admin API Access Token
  access-token: ${SHOPIFY_ACCESS_TOKEN}
  # API Version (update quarterly as Shopify releases new versions)
  api-version: ${SHOPIFY_API_VERSION:2025-01}
  # GraphQL endpoint will be: https://{shop-url}/admin/api/{api-version}/graphql.json

  # Rate Limiting Configuration
  rate-limit:
    # Max points per second (adjust based on your Shopify plan)
    # Basic: 100, Advanced: 200, Plus: 1000, Enterprise: 2000
    max-points-per-second: ${SHOPIFY_MAX_POINTS:100}
    # Retry configuration
    max-retries: ${SHOPIFY_MAX_RETRIES:3}
    initial-backoff-ms: ${SHOPIFY_INITIAL_BACKOFF:1000}

  # Shopify App Configuration (OAuth)
  app:
    # Your Shopify App API Key (from Shopify Partners dashboard)
    api-key: ${SHOPIFY_APP_API_KEY}
    # Your Shopify App API Secret (from Shopify Partners dashboard)
    api-secret: ${SHOPIFY_APP_API_SECRET}
    # OAuth scopes required by your app (comma-separated)
    scopes: ${SHOPIFY_APP_SCOPES:read_products,read_orders,read_customers}
    # OAuth redirect URI (must match Shopify Partners dashboard)
    redirect-uri: ${SHOPIFY_APP_REDIRECT_URI:http://localhost:8080/shopify/callback}
    # App install URI (entry point for OAuth flow)
    install-uri: ${SHOPIFY_APP_INSTALL_URI:http://localhost:8080/shopify/install}
    # OAuth callback URI (where Shopify redirects after approval)
    callback-uri: ${SHOPIFY_APP_CALLBACK_URI:http://localhost:8080/shopify/callback}

# AI Chat Configuration
anthropic:
  api:
    key: ${ANTHROPIC_API_KEY:}
    version: ${ANTHROPIC_API_VERSION:2023-06-01}
  # Valid Claude models (see ModelConfig.java for complete list):
  # Claude 4.6: claude-sonnet-4-6 (DEFAULT - latest), claude-opus-4-6 (most capable)
  # Claude 4.5: claude-sonnet-4-5-20250929, claude-opus-4-1-20250805, claude-haiku-4-5-20251001
  # Claude 4: claude-sonnet-4-20250514, claude-opus-4-20250514
  # Claude 3.7: claude-3-7-sonnet-20250219
  # Claude 3.5: claude-3-5-haiku-20241022 (NOTE: This is HAIKU, not Sonnet!)
  # Claude 3: claude-3-opus-20240229, claude-3-sonnet-20240229, claude-3-haiku-20240307
  model: ${ANTHROPIC_MODEL:claude-sonnet-4-6}
  max-tokens: ${ANTHROPIC_MAX_TOKENS:1024}
  temperature: ${ANTHROPIC_TEMPERATURE:0.7}
  system-prompt-file: ${ANTHROPIC_SYSTEM_PROMPT_FILE:classpath:prompts/system-prompt.txt}

# Chatbot Configuration
chatbot:
  # Store Identity
  store:
    name: ${CHATBOT_STORE_NAME:Hearn's Hobbies}
    description: ${CHATBOT_STORE_DESCRIPTION:An online hobby store specializing in model kits and hobby supplies}
    categories: ${CHATBOT_STORE_CATEGORIES:model kits, hobby paints, tools, crafting supplies, model accessories}

  # Behavior Rules
  behavior:
    scope-instructions: ${CHATBOT_SCOPE_INSTRUCTIONS:We specialize in hobby and model building supplies including Gundam model kits, scale models, hobby paints, tools, and accessories for model enthusiasts.}
    out-of-scope-response: ${CHATBOT_OUT_OF_SCOPE:I specialize in hobby supplies and model kits. While I don't have information about that specific item, I'd be happy to help you find model kits, paints, or hobby tools from our catalog!}
    require-search: ${CHATBOT_REQUIRE_SEARCH:true}

  # Tool Configuration
  tools:
    enable-product-search: ${CHATBOT_ENABLE_SEARCH:true}
    max-search-results: ${CHATBOT_MAX_RESULTS:10}
    low-stock-threshold: ${CHATBOT_LOW_STOCK_THRESHOLD:5}
    # Products carrying any of these tags (case-insensitive) are treated as
    # available-to-preorder rather than out of stock, and upsold by the chatbot.
    preorder-tags: ${CHATBOT_PREORDER_TAGS:preorder,pre-order}
    preorder-upsell-enabled: ${CHATBOT_PREORDER_UPSELL_ENABLED:true}

  # Response Style
  response:
    tone: ${CHATBOT_TONE:friendly}
    include-cart-links: ${CHATBOT_INCLUDE_CART_LINKS:true}
    include-product-links: ${CHATBOT_INCLUDE_PRODUCT_LINKS:true}
    show-prices: ${CHATBOT_SHOW_PRICES:true}
    show-skus: ${CHATBOT_SHOW_SKUS:true}

  # Advanced
  custom-instructions: ${CHATBOT_CUSTOM_INSTRUCTIONS:}

# CRS MCP Configuration (In-Store ERP System)
crs:
  mcp:
    # MCP Server URL
    url: ${CRS_MCP_URL:https://web-production-2534.up.railway.app/mcp}
    # Enable/disable CRS integration
    enabled: ${CRS_MCP_ENABLED:true}
    # Timeout for MCP requests (milliseconds)
    timeout-ms: ${CRS_MCP_TIMEOUT:10000}
  agent:
    # Hard cap on a single chat-triggered "expert help" delegation (milliseconds).
    # Must stay below spring.mvc.async.request-timeout so a stalled delegation ends
    # as a clean event:error rather than the whole stream being reaped.
    delegation-timeout-ms: ${CRS_AGENT_DELEGATION_TIMEOUT:75000}

# Logging Configuration
logging:
  level:
    root: INFO
    com.shopify.api: DEBUG
    org.springframework.web: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n"

# Inventory Analysis Module Configuration
inventory-analysis:
  # Enable/disable the entire module
  enabled: ${INVENTORY_ANALYSIS_ENABLED:true}

  # Stock alert thresholds
  thresholds:
    # Alert when stock will last fewer than N days (CRITICAL level)
    critical-stock-days: ${CRITICAL_STOCK_DAYS:3}
    # Alert when stock will last fewer than N days (WARNING level)
    warning-stock-days: ${WARNING_STOCK_DAYS:7}
    # Informational alert threshold
    info-stock-days: ${INFO_STOCK_DAYS:14}

  # Safety stock calculation
  safety:
    # Additional days of stock to maintain as buffer
    safety-stock-days: ${SAFETY_STOCK_DAYS:7}
    # Multiplier for safety stock (higher = more conservative)
    # Formula: Safety Stock = Daily Velocity × Safety Days × Multiplier
    safety-multiplier: ${SAFETY_MULTIPLIER:1.5}

  # Sales velocity configuration
  velocity:
    # Default window for velocity calculation (days)
    default-window-days: ${VELOCITY_WINDOW_DAYS:30}
    # Minimum sales for reliable calculation
    minimum-sales-threshold: ${MIN_SALES_THRESHOLD:5}
    # Trend detection threshold (percentage change)
    # Changes above this threshold are considered INCREASING or DECREASING
    trend-threshold-percentage: ${TREND_THRESHOLD:15.0}

  # AI-powered analysis settings
  ai:
    # Enable AI-powered insights via Claude
    enabled: ${AI_ANALYSIS_ENABLED:true}
    # Temperature for AI recommendations (0.0-1.0)
    # Lower = more focused/deterministic, Higher = more creative
    temperature: ${AI_TEMPERATURE:0.3}
    # Max tokens for AI response
    max-tokens: ${AI_MAX_TOKENS:1000}

  # Scheduled jobs configuration (Cron expressions)
  schedule:
    # Update sales velocity every hour
    # Cron: second minute hour day month weekday
    velocity-update-cron: ${VELOCITY_CRON:0 0 * * * *}

    # Check for low stock every 6 hours
    low-stock-check-cron: ${LOW_STOCK_CRON:0 0 */6 * * *}

    # Generate recommendations daily at 8 AM
    recommendations-cron: ${RECOMMENDATIONS_CRON:0 0 8 * * *}

  # Performance tuning
  performance:
    # Max products to analyze in parallel
    parallel-analysis-limit: ${PARALLEL_LIMIT:10}
    # Timeout for MCP calls (milliseconds)
    mcp-timeout-ms: ${MCP_TIMEOUT:10000}
    # Cache TTL for analysis results (seconds)
    cache-ttl-seconds: ${CACHE_TTL:3600}
